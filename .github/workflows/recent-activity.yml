name: Recent Activity

on:
  schedule:
    - cron: "23 2,14 * * *" # 02:23 and 14:23 UTC (11:23 and 23:23 JST); off the hour, when scheduled runs are less delayed
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-refresh
  cancel-in-progress: false

jobs:
  update-readme:
    name: Update README with Recent Activity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # The personal token is optional: public activity can be read with the built-in one.
      GITHUB_TOKEN: ${{ secrets.RECENT_ACTIVITY || github.token }}
      README_LOGIN: VoxDroid
      README_TZ: Asia/Tokyo
      COMMITTER_NAME: VoxDroid
      COMMITTER_EMAIL: 78334105+VoxDroid@users.noreply.github.com

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      # Both scripts have no dependencies, so there is nothing to install.
      # Each keeps the existing content if GitHub's API is unavailable.
      - name: Write the activity digest
        continue-on-error: true
        run: node scripts/readme/activity.mjs

      - name: Redraw README charts
        continue-on-error: true
        run: node scripts/readme/charts.mjs

      - name: Commit and push
        run: |
          git add README.md readme
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name "$COMMITTER_NAME"
          git config user.email "$COMMITTER_EMAIL"
          git commit -m "Update README with recent activity"
          git pull --rebase --autostash
          git push
